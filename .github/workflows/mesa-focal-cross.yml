name: build mesa lima_dri.so (focal cross)

# Cross-builds Mesa 21.2.6's lima driver for armhf using focal's OWN
# arm-linux-gnueabihf cross toolchain (gcc 9.3 + glibc 2.31 sysroot), running
# inside an amd64 ubuntu:20.04 container.  No qemu emulation, no glibc-version
# hack: focal's cross toolchain links against glibc 2.31 natively, so the .so
# loads unchanged on the Hi3798MV100 box (which is focal glibc 2.31).
#
# Output: artifact `lima_dri_focal_cross` with libgallium_dri.so + sha256 + info.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Build (amd64 focal container, cross-compile armhf)
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD":/work \
            -w /work \
            -e WORK=/work \
            ubuntu:20.04 \
            bash /work/mesa/build_focal_cross.sh
          echo "--- out/ ---"
          ls -l out || true

      - name: Collect artifact
        if: always()
        run: |
          ls -l out || true
          [ -f out/libgallium_dri.so ] && cat out/info.txt || echo "no .so produced"

      - name: Upload libgallium_dri.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lima_dri_focal_cross
          path: out/*
          if-no-files-found: warn
          retention-days: 30
