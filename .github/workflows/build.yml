name: build mv100 kernel

# Builds a Hi3798MV100 (Huawei EC6108V9C) uImage from the histb-mainline tree.
# The kernel source is cloned inside the runner, so this repository only needs
# to carry build.sh + this workflow file.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'build.sh'
      - '.github/workflows/build.yml'
      # The patches are whole-file replacements injected by build.sh; a change
      # there changes the kernel just as much as a change to build.sh does.
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            kmod cpio rsync u-boot-tools device-tree-compiler \
            gcc-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | head -1

      # 2026-11-05T08:34Z: histb-mainline/linux force-pushed its `histb` branch
      # to a single "init" commit whose tree only holds README.md, so a branch
      # clone now yields an *empty* checkout in under a second (and codeload
      # hands back a 291-byte empty tarball).  Pin the last good commit instead
      # -- GitHub still serves unreferenced objects by full sha.
      - name: Fetch kernel (pinned commit)
        run: |
          set +e
          SHA=4a102ade5e075f662f2eec1f27d829a7fd7932e1
          ok=0
          for attempt in 1 2 3; do
            echo "===== attempt $attempt ($SHA) ====="
            rm -rf mv100-linux
            git init -q mv100-linux
            git -C mv100-linux remote add origin \
              https://github.com/histb-mainline/linux.git
            git -C mv100-linux fetch --depth 1 --no-tags origin "$SHA"
            rc=$?
            echo "fetch rc=$rc"
            if [ $rc -eq 0 ]; then
              git -C mv100-linux checkout -q FETCH_HEAD
              if [ -f mv100-linux/Makefile ] && [ -d mv100-linux/drivers/gpu/drm/histb ]; then
                ok=1; break
              fi
              echo "checkout incomplete:"; ls mv100-linux | head
            fi
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::cannot fetch $SHA"; exit 1; }
          git -C mv100-linux log -1 --format='%H %ad %s'
          head -4 mv100-linux/Makefile | tr '\n' ' '; echo

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp obj-mv100/arch/arm/boot/uImage-mv100.img out/
          cp obj-mv100/arch/arm/boot/dts/hisilicon/hi3798mv100-ec6108v9c.dtb out/
          cp obj-mv100/arch/arm/boot/zImage out/zImage
          cp obj-mv100/.config out/kernel.config
          ls -lh out/

      - name: Upload uImage
        uses: actions/upload-artifact@v4
        with:
          name: mv100-uImage
          path: out/
          if-no-files-found: error
          retention-days: 90
