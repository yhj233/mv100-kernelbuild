name: build mv100 kernel

# Builds a Hi3798MV100 (Huawei EC6108V9C) uImage from the histb-mainline tree.
# The kernel source is cloned inside the runner, so this repository only needs
# to carry build.sh + this workflow file.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'build.sh'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            kmod cpio rsync u-boot-tools device-tree-compiler \
            gcc-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | head -1

      # Until 2026-11-05 a plain shallow clone worked here.  It then started
      # failing after ~0.4s with no git message at all (bash -e exits on the
      # failing `git clone && break` list, so the loop never retried and the
      # stderr text was lost).  Keep git clone as the first choice -- it gives
      # the -g<hash> in the kernel release string -- but fall back to the
      # codeload tarball, which is a single HTTPS GET and far more robust.
      - name: Fetch kernel (histb branch)
        run: |
          set +e
          ok=0
          for attempt in 1 2 3; do
            echo "===== attempt $attempt ====="
            echo "-- git ls-remote --"
            git ls-remote --heads https://github.com/histb-mainline/linux.git 2>&1 | head -5
            echo "-- git clone --"
            git clone --depth 1 -b histb \
              https://github.com/histb-mainline/linux.git mv100-linux
            rc=$?
            echo "git clone rc=$rc"
            if [ $rc -eq 0 ] && [ -f mv100-linux/Makefile ]; then ok=1; break; fi
            rm -rf mv100-linux

            echo "-- tarball fallback --"
            curl -fL --retry 3 --retry-delay 5 -o /tmp/linux.tar.gz \
              https://codeload.github.com/histb-mainline/linux/tar.gz/refs/heads/histb
            rc=$?
            echo "curl rc=$rc  size=$(stat -c %s /tmp/linux.tar.gz 2>/dev/null)"
            if [ $rc -eq 0 ]; then
              mkdir -p mv100-linux
              tar -xzf /tmp/linux.tar.gz -C mv100-linux --strip-components=1
              if [ -f mv100-linux/Makefile ]; then ok=1; break; fi
            fi
            rm -rf mv100-linux; sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::no kernel source after 3 attempts"; exit 1; }
          test -f mv100-linux/Makefile
          git -C mv100-linux log -1 --format='%h %ad %s' 2>/dev/null || echo "(from tarball)"

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp obj-mv100/arch/arm/boot/uImage-mv100.img out/
          cp obj-mv100/arch/arm/boot/dts/hisilicon/hi3798mv100-ec6108v9c.dtb out/
          cp obj-mv100/arch/arm/boot/zImage out/zImage
          cp obj-mv100/.config out/kernel.config
          ls -lh out/

      - name: Upload uImage
        uses: actions/upload-artifact@v4
        with:
          name: mv100-uImage
          path: out/
          if-no-files-found: error
          retention-days: 90
