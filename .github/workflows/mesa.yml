name: build mesa lima_dri.so

# Cross-builds Mesa 21.2.6's lima driver for armhf, natively on an amd64
# runner (arm-linux-gnueabihf cross toolchain, no qemu emulation).  The result
# is a megadriver libgallium_dri.so that drops in as
# /usr/lib/arm-linux-gnueabihf/dri/lima_dri.so on the Hi3798MV100 box
# (Ubuntu 20.04 armhf, mesa 21.2.6-0ubuntu0.1~20.04.2).
#
# The cross toolchain's own armhf sysroot carries glibc 2.31 (same as focal),
# so the .so has no GLIBC_2.31+ symbols and loads unchanged.  Verified in the
# build log via readelf --version-info.
#
# Output: artifact `lima_dri` with libgallium_dri.so + sha256.txt + info.txt.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'mesa/**'
      - '.github/workflows/mesa.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Build (cross-compile)
        run: |
          set -x
          bash mesa/build.sh
          echo "--- out/ ---"
          ls -l out || true

      - name: Collect artifact
        if: always()
        run: |
          ls -l out || true
          [ -f out/libgallium_dri.so ] && cat out/info.txt || echo "no .so produced"

      - name: Upload libgallium_dri.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lima_dri
          path: out/*
          if-no-files-found: warn
          retention-days: 30
